name: Feature request
description: Propose a new DukaFlow AI capability
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or business problem should be solved?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be true before the issue is complete.
      placeholder: |
        - [ ] Condition one
        - [ ] Condition two
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Workstream
      options:
        - Backend
        - Frontend
        - AI service
        - Database
        - DevOps
        - Documentation
        - Cross-service
    validations:
      required: true
